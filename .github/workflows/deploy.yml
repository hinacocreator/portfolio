# 使っている action の版は、各リポジトリの GitHub Releases で実在を確認した最新メジャー版
# （checkout v7 / setup-node v7 / configure-pages v6 / upload-pages-artifact v5 / deploy-pages v5）。
# 初回の公開前に、Settings → Pages → Source を「GitHub Actions」にしておくこと（README 参照）。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # GitHub の Actions 画面から手動実行したいとき用
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # GitHub Pages の設定（Settings > Pages）から、サブパスと公開URLを読み取る。
      #   ・プレビュー公開（https://ユーザー名.github.io/リポジトリ名/）→ base_path は /リポジトリ名
      #   ・独自ドメイン（Custom domain 設定済み）                    → base_path は空
      # ドメインやリポジトリ名をこのファイルに直書きしないための仕組み。
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      # 写真の原本（_source-photos/）は公開リポジトリに入れていないため、ここでは
      # `npm run images` を実行しない。public/images/ にコミット済みの生成物をそのまま使う。
      - name: Build (static export)
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # 公開URLを手動で固定したいときは、リポジトリの Variables に
          # NEXT_PUBLIC_SITE_URL を登録すると、そちらが優先される。
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || steps.pages.outputs.base_url }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
